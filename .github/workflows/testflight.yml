# Compila ZOE, la firma con il tuo account Apple e la carica su TestFlight.
# Serve la chiave API di App Store Connect nei "secrets" del repository (vedi ios/TESTFLIGHT.md).
# Senza chiave il flusso si ferma subito, senza errori.
name: TestFlight

on:
  push:
    branches: [claude/vibrant-lovelace-zoo9eq]
    paths: ["ios/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Controlla la chiave API
        id: key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Chiave App Store Connect non configurata: salto il caricamento su TestFlight (vedi ios/TESTFLIGHT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'

      - name: Prepara XcodeGen e la chiave
        if: steps.key.outputs.ready == 'true'
        run: |
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Genera il progetto
        if: steps.key.outputs.ready == 'true'
        working-directory: ios
        run: xcodegen

      - name: Archivia (firma automatica)
        if: steps.key.outputs.ready == 'true'
        working-directory: ios
        run: |
          xcodebuild -project ZOE.xcodeproj -scheme ZOE -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZOE.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet archive

      - name: Carica su TestFlight
        if: steps.key.outputs.ready == 'true'
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZOE.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cancella la chiave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
