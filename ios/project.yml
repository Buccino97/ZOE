# Progetto Xcode di ZOE per iPhone, descritto per XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Per generare ZOE.xcodeproj:   cd ios && xcodegen
# Le impostazioni personali (identificativo e team) stanno in Config.xcconfig.

name: ZOE
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

packages:
  ZoeKit:
    path: Packages/ZoeKit

targets:
  ZOE:
    type: application
    platform: iOS
    sources:
      - path: ZOE
      - path: Shared
    dependencies:
      - package: ZoeKit
        product: ZoeCore
      - package: ZoeKit
        product: ZoeUI
      - package: ZoeKit
        product: ZoeShared
      - target: ZOEWidgets
    info:
      path: ZOE/Info.plist
      properties:
        CFBundleDisplayName: ZOE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ZoeAppGroup: group.$(ZOE_BUNDLE_PREFIX)
    entitlements:
      path: ZOE/ZOE.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ZOE_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZOE_BUNDLE_PREFIX)
        PRODUCT_NAME: ZOE
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ZOEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ZOEWidgets
      - path: Shared
    dependencies:
      - package: ZoeKit
        product: ZoeCore
      - package: ZoeKit
        product: ZoeUI
      - package: ZoeKit
        product: ZoeShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: ZOEWidgets/Info.plist
      properties:
        CFBundleDisplayName: ZOE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ZoeAppGroup: group.$(ZOE_BUNDLE_PREFIX)
    entitlements:
      path: ZOEWidgets/ZOEWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ZOE_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZOE_BUNDLE_PREFIX).widgets
        PRODUCT_NAME: ZOEWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  ZOE:
    build:
      targets:
        ZOE: all
        ZOEWidgets: all
    run:
      config: Debug
    archive:
      config: Release
